# CI/CD dla Kantyny (kod w app/).
# - pull_request: testy i lint chartu
# - push na main: testy -> build i push obrazów do ECR -> helm upgrade -> rollout -> smoke test
# Komendy odpowiadają app/Makefile (test-orders-api, test-payments, helm-lint, build/push).
name: ci

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

# Brak uprawnień na poziomie workflow; każdy job ustawia własne.
permissions: {}

env:
  AWS_REGION: eu-central-1
  EKS_CLUSTER: aiops

concurrency:
  group: ci-${{ github.ref }}
  # Na PR anulujemy stare przebiegi; na main nie przerywamy wdrożenia.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-orders-api:
    name: test orders-api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/orders-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: app/orders-api/uv.lock

      # --locked: zależności muszą być zgodne z uv.lock
      - name: Synchronizacja zależności
        run: uv sync --locked

      - name: pytest
        run: uv run pytest -q

  test-payments:
    name: test payments
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/payments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Wersja Go z go.mod (go 1.23)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/payments/go.mod
          cache-dependency-path: app/payments/go.sum

      - name: go test
        run: go test ./...

  helm-lint:
    name: helm lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: helm lint
        run: helm lint app/deploy/helm/kantyna

  build:
    name: build ${{ matrix.service }}
    if: github.event_name == 'push'
    needs: [test-orders-api, test-payments, helm-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        # loadgen i Postgres nie są budowane w CI
        service: [orders-api, payments, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # OIDC: brak kluczy AWS w sekretach
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: kantyna-ci-build
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build i push ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_VARIANT=stable
          tags: ${{ vars.ECR_REGISTRY }}/kantyna/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: deploy do klastra
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # Jedno wdrożenie naraz do jednego namespace; nie przerywamy trwającego.
    concurrency:
      group: deploy-${{ vars.K8S_NAMESPACE }}
      cancel-in-progress: false
    env:
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: kantyna-ci-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Kubeconfig dla klastra
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: helm upgrade
        run: |
          helm upgrade kantyna app/deploy/helm/kantyna \
            --namespace "$K8S_NAMESPACE" \
            --reuse-values \
            --set global.imageRegistry="$ECR_REGISTRY" \
            --set global.imageTag="$GITHUB_SHA"

      - name: Rollout status
        run: |
          for component in orders-api payments worker web; do
            kubectl --namespace "$K8S_NAMESPACE" rollout status "deployment/kantyna-$component" --timeout=5m
          done

      # Smoke test z wnętrza klastra: wget działa w obrazie web (nginx-unprivileged, alpine)
      - name: Smoke test /healthz
        run: |
          kubectl --namespace "$K8S_NAMESPACE" exec deploy/kantyna-web -- \
            wget -qO- http://kantyna-orders-api:8000/healthz
          kubectl --namespace "$K8S_NAMESPACE" exec deploy/kantyna-web -- \
            wget -qO- http://kantyna-web:8080/healthz
